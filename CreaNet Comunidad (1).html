/* ---------- almacén local (modo demostración) ---------- */
function makeLocalStore(){
  var KEY='creanet.demo.v1',data={};
  try{data=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){data={}}
  COLS.forEach(function(c){data[c]=data[c]||{}});
  var subs={};
  function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
  function list(c){return Object.keys(data[c]).map(function(id){var o=Object.assign({},data[c][id]);o.id=id;return o})}
  function emit(c){(subs[c]||[]).forEach(function(f){f(list(c))})}
  return {local:true,
    watch:function(c,cb){(subs[c]=subs[c]||[]).push(cb);setTimeout(function(){cb(list(c))},0)},
    put:function(c,id,v){data[c][id]=v;save();emit(c);return Promise.resolve()},
    patch:function(c,id,v){data[c][id]=Object.assign({},data[c][id],v);save();emit(c);return Promise.resolve()},
    del:function(c,id){delete data[c][id];save();emit(c);return Promise.resolve()}
  };
}
/* ---------- almacén compartido (db) ---------- */
function makeDbStore(db){
  var q={};
  function chain(path,fn){q[path]=(q[path]||Promise.resolve()).catch(function(){}).then(fn);return q[path]}
  return {local:false,
    watch:function(c,cb){
      db.collection(c).onSnapshot(function(s){cb(s.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o}))},
        function(e){S.dbError=e&&e.code;sched()});
    },
    put:function(c,id,v){return chain(c+'/'+id,function(){return db.doc(c+'/'+id).set(v)})},
    patch:function(c,id,v){return chain(c+'/'+id,function(){return db.doc(c+'/'+id).update(v)})},
    del:function(c,id){return chain(c+'/'+id,function(){return db.doc(c+'/'+id).delete()})}
  };
}

/* ---------- cálculos de nivel ---------- */
function statsFor(uid){
  var posts=S.posts.filter(function(p){return p.author===uid}).length;
  var sales=S.purchases.filter(function(x){return x.seller===uid&&x.status==='confirmed'}).length;
  var buys=S.purchases.filter(function(x){return x.buyer===uid&&x.status==='confirmed'}).length;
  var likes=S.likes.filter(function(l){return l.owner===uid}).length;
  var score=posts+3*sales;
  var lvl=posts===0?0:score>=25?3:score>=10?2:1;
  var bt=0;BUYER.forEach(function(b,i){if(buys>=b.min)bt=i});
  var pct,next;
  if(lvl===0){pct=0;next='Publica tu primer hobby para ser Emprendedor novato.'}
  else if(lvl===1){pct=(score-1)/9;next='Te faltan '+(10-score)+' puntos para ser Emprendedor tuani.'}
  else if(lvl===2){pct=(score-10)/15;next='Te faltan '+(25-score)+' puntos para ser Emprendedor experimentado.'}
  else{pct=1;next='Alcanzaste el nivel más alto. Sigue publicando y vendiendo.'}
  return {posts:posts,sales:sales,buys:buys,likes:likes,score:score,lvl:lvl,buyer:bt,pct:Math.max(0,Math.min(1,pct)),next:next};
}

function num(v){var n=parseFloat(v);return isFinite(n)&&n>=0?n:0}
function calcUpdate(){
  var c=S.calc,mat=num(c.mat),ext=num(c.extra),hrs=num(c.hours),rate=num(c.rate),mg=num(c.margin),inv=num(c.invest);
  var variable=mat+ext,time=hrs*rate,cost=variable+time,price=Math.ceil(cost*(1+mg/100)),profit=price-variable;
  var out=$('#calc-out');if(!out)return;
  var units=price-variable>0&&inv>0?Math.ceil(inv/(price-variable)):0;
  out.innerHTML='<div class="eyebrow">Precio sugerido por unidad</div><div class="big">'+money(price)+'</div>'+
   '<div class="kv"><span>Costo de materiales y envío</span><b>'+money(variable)+'</b></div>'+
   '<div class="kv"><span>Pago por tu tiempo</span><b>'+money(time)+'</b></div>'+
   '<div class="kv"><span>Precio mínimo para no perder dinero</span><b>'+money(variable)+'</b></div>'+
   '<div class="kv"><span>Te queda por unidad (con tu tiempo pagado)</span><b>'+money(profit)+'</b></div>'+
   (inv>0?'<div class="kv"><span>Unidades para recuperar tu inversión</span><b>'+(units||'—')+'</b></div>':'')+
   '<p class="muted" style="margin:.3rem 0 0;font-size:.85rem">Compara con lo que cobran otras personas por algo parecido antes de decidir.</p>';
  var chk=$$('[data-ready]'),n=chk.filter(function(x){return x.checked}).length;
  S.readyChecks=chk.map(function(x){return x.checked});
  var msg=n<=2?'Aún es temprano, y está bien. Publica más trabajos, pide opiniones en los comentarios y calcula tus costos. Cuando tengas 3 trabajos terminados, vuelve a revisar.':
          n<=4?'Vas bien. Puedes empezar con una venta pequeña a conocidos o por encargo, para probar tu precio sin arriesgar mucho dinero.':
               'Estás listo para empezar a vender en pequeño. Publica con tipo “Vendo”, pon tu precio y activa el contacto en tu perfil.';
  var v=$('#verdict');if(v)v.innerHTML='<b>'+n+' de '+chk.length+'.</b> '+esc(msg);
}

function sha(str){
  try{return crypto.subtle.digest('SHA-256',new TextEncoder().encode(str)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2)}).join('')})}
  catch(e){return Promise.resolve('x'+str)}
}

function startSession(uid){
  S.uid=uid;S.loggedIn=true;
  try{if(store.local)localStorage.setItem('creanet.demo.session',uid);else sessionStorage.removeItem('creanet.out')}catch(e){}
  S.prevLvl=statsFor(uid).lvl;

function doRegister(form){
  var user=form.elements.user.value.trim().toLowerCase(),name=form.elements.name.value.trim(),hobby=form.elements.hobby.value.trim();
  if(!/^[a-z0-9_]{3,20}$/.test(user))return setErr('El usuario debe tener 3 a 20 letras minúsculas, números o guion bajo.');
  if(!name)return setErr('Escribe el nombre que quieres mostrar.');
  if(!form.elements.rules.checked)return setErr('Debes aceptar las reglas de la comunidad.');
  if(S.profiles.some(function(p){return p.username===user}))return setErr('Ese nombre de usuario ya existe. Prueba con otro.');
  var local=store.local,pass=local?form.elements.pass.value:'';
  if(local&&pass.length<6)return setErr('La contraseña debe tener al menos 6 caracteres.');
  var uid=local?'l_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36):S.uid;
  if(!uid)return setErr('No se pudo identificar tu sesión.');
  var prof={username:user,name:name,hobby:hobby,bio:'',emoji:EMOJIS[Math.floor(Math.random()*EMOJIS.length)],color:COLORS[Math.floor(Math.random()*COLORS.length)],frame:'none',stickers:[],contacts:{network:'',handle:'',show:false},created:Date.now()};
  var p=local?sha('creanet:'+pass).then(function(hh){var a=accounts();a[user]={uid:uid,hash:hh};saveAccounts(a)}):Promise.resolve();
  p.then(function(){return store.put('profiles',uid,prof)}).then(function(){startSession(uid);closeModal();toast('¡Cuenta creada! Ya eres Observador. Publica tu primer hobby para subir de nivel.');sched()})
   .catch(function(){setErr('No se pudo crear la cuenta. Es posible que tu acceso sea de solo lectura.')});
}

function resizeImage(file,mx,qq){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){var im=new Image();im.onload=function(){
      var max=mx||720,sc=Math.min(1,max/Math.max(im.width,im.height)),cv=document.createElement('canvas');
      cv.width=Math.round(im.width*sc);cv.height=Math.round(im.height*sc);
      cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
      res(cv.toDataURL('image/jpeg',qq||0.72));
    };im.onerror=rej;im.src=fr.result};
    fr.onerror=rej;fr.readAsDataURL(file);
  });
}

   '<div class="card" style="box-shadow:none;display:grid;gap:.7rem;background:var(--surface-2)"><div class="eyebrow">Contacto de interesados</div>'+
   '<label class="f" for="e-net">Red social asociada<select id="e-net" name="net"><option value="">Ninguna</option>'+Object.keys(NETS).map(function(k){return '<option value="'+k+'"'+(c.network===k?' selected':'')+'>'+NETS[k]+'</option>'}).join('')+'</select></label>'+
   '<label class="f" for="e-handle">Tu usuario o número en esa red<small>Ej: mi_usuario (sin @) o +505 8888 8888</small><input id="e-handle" name="handle" type="text" maxlength="40" value="'+esc(c.handle)+'"></label>'+
   '<label class="chk" style="border:0;padding:0"><input type="checkbox" name="show"'+(c.show?' checked':'')+'><span>Mostrar este contacto a quien lo pida desde mis publicaciones o mi perfil</span></label>'+
   '<p class="safe" style="margin:0">Tú decides qué mostrar. No pongas tu dirección, datos de banco ni contraseñas. Si eres menor de edad, avisa a un adulto antes de pagar o reunirte con alguien.</p></div>'+
   '<p class="err" id="prof-err" role="alert"></p><button class="btn primary" type="submit">Guardar cambios</button></form>';
  openModal(h);
}
function doProfile(form){
  var name=form.elements.name.value.trim(),net=form.elements.net.value,handle=form.elements.handle.value.trim();
  var err=$('#prof-err');
  if(!name){err.textContent='El nombre no puede quedar vacío.';return}
  if(net&&!/^[A-Za-z0-9._+\- ]{2,40}$/.test(handle)){err.textContent='Escribe un usuario o número válido para esa red.';return}
  guard(store.patch('profiles',S.uid,{name:name,hobby:form.elements.hobby.value.trim(),bio:form.elements.bio.value.trim(),emoji:form.elements.emoji.value,color:form.elements.color.value,
    contacts:{network:net,handle:net?handle.replace(/^@/,''):'',show:!!(net&&handle&&form.elements.show.checked)}})).then(function(){closeModal();toast('Perfil actualizado.');sched()});
}

function contactLinks(c){
  var h=c.handle,u='';
  if(c.network==='instagram'&&/^[A-Za-z0-9._]{1,40}$/.test(h))u='https://instagram.com/'+h;
  if(c.network==='tiktok'&&/^[A-Za-z0-9._]{1,40}$/.test(h))u='https://www.tiktok.com/@'+h;
  if(c.network==='facebook'&&/^[A-Za-z0-9.]{1,40}$/.test(h))u='https://facebook.com/'+h;
  if(c.network==='whatsapp'){var d=h.replace(/[^0-9]/g,'');if(d.length>=8)u='https://wa.me/'+d}
  return u;
}
function contactModal(uid){
  var a=profile(uid);if(!a||!a.contacts||!a.contacts.show||!a.contacts.handle){toast('Esta persona no muestra contacto.');return}
  var c=a.contacts,u=contactLinks(c);
  openModal('<div class="mh"><h2>Contactar a '+esc(a.name||a.username)+'</h2><button class="x" type="button" data-act="closemodal" aria-label="Cerrar">×</button></div>'+
   '<div class="row">'+avatar(a,56)+'<div><b>'+esc(NETS[c.network]||'Red')+'</b><div style="font-size:1.2rem;overflow-wrap:anywhere" id="handle-txt">'+esc(c.handle)+'</div></div></div>'+
   '<div class="row">'+(u?'<a class="btn primary" href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">Abrir en '+esc(NETS[c.network])+'</a>':'')+'<button class="btn" type="button" data-act="copy" data-t="'+esc(c.handle)+'">Copiar</button></div>'+
   '<p class="safe" style="margin:0"><b>Cuida tu seguridad.</b> Habla primero por mensaje, no compartas dirección ni datos de banco, y si eres menor de edad avisa a un adulto antes de pagar o reunirte. Después de comprar, pídele al vendedor que confirme la venta en CreaNet.</p>');
}
function shareModal(pid){
  var p=S.posts.filter(function(x){return x.id===pid})[0];if(!p)return;
  var a=profile(p.author)||{};
  var link=(APP_URL.indexOf('__')===0?'':APP_URL+'#post-'+pid);
  var text='Mira “'+p.title+'” de @'+(a.username||'usuario')+' en CreaNet Comunidad.'+(link?' '+link:'');
  openModal('<div class="mh"><h2>Compartir publicación</h2><button class="x" type="button" data-act="closemodal" aria-label="Cerrar">×</button></div>'+
   '<p class="card" style="box-shadow:none;margin:0;background:var(--surface-2);overflow-wrap:anywhere" id="share-txt">'+esc(text)+'</p>'+
   '<button class="btn primary" type="button" data-act="copy" data-share="'+esc(pid)+'" data-t="'+esc(text)+'">Copiar texto para compartir</button>'+
   '<p class="muted" style="margin:0;font-size:.9rem">Pégalo en tus historias, estados o chats.</p>');
}

/* ---------- acciones ---------- */
function firstPurchaseOf(pid){return S.purchases.filter(function(x){return x.pid===pid&&x.buyer===S.uid})[0]}
function setBg(inp){
  var f=inp.files&&inp.files[0];if(!f)return;if(!canDo())return;
  (function tryQ(max,q){return resizeImage(f,max,q).then(function(d){if(d.length>170000&&q>0.4)return tryQ(Math.round(max*0.8),q-0.1);if(d.length>170000)throw new Error('big');return d})})(1200,0.62)
   .then(function(d){return store.patch('profiles',S.uid,{bg:d})}).then(function(){toast('Fondo actualizado.')})
   .catch(function(){toast('No se pudo usar esa imagen. Prueba con otra.')});
  inp.value='';
}
var A={
  bgclear:function(){guard(store.patch('profiles',S.uid,{bg:''}))},
  nav:function(t){S.view={name:t.dataset.v};if(t.dataset.v==='profile'&&!S.loggedIn){S.view={name:'profile'}}sched();window.scrollTo(0,0)},
  user:function(t){S.view={name:'user',uid:t.dataset.uid};sched();window.scrollTo(0,0)},
  auth:function(t){authModal(t.dataset.tab)},
  authtab:function(t){authModal(t.dataset.tab)},
  closemodal:function(){closeModal()},
  ovclose:function(t,e){if(e.target===t)closeModal()},
  ftype:function(t){S.filter.type=t.dataset.v;sched()},
  fcat:function(t){S.filter.cat=t.dataset.v;sched()},
  compose:function(){composeModal()},
  ptype:function(t){
    var f=t.closest('form');$$('[data-act=ptype]',f).forEach(function(b){b.setAttribute('aria-pressed',b===t)});
    f.elements.type.value=t.dataset.v;$('#p-price-w').hidden=t.dataset.v!=='vendo';
  },
  like:function(t){
    if(!requireLogin()||!canDo())return;
    var pid=t.dataset.id,id=pid+'_'+S.uid,has=S.likes.some(function(l){return l.id===id});
    var post=S.posts.filter(function(x){return x.id===pid})[0];if(!post)return;
    guard(has?store.del('likes',id):store.put('likes',id,{pid:pid,uid:S.uid,owner:post.author,ts:Date.now()}));
  },
  cm:function(t){S.open[t.dataset.id]=!S.open[t.dataset.id];sched()},
  sendcm:function(t){
    if(!requireLogin()||!canDo())return;
    var pid=t.dataset.id,ta=$('[data-draft="c-'+pid+'"]'),txt=ta.value.trim();if(!txt)return;
    var id='c'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    ta.value='';guard(store.put('comments',id,{pid:pid,uid:S.uid,text:txt.slice(0,400),ts:Date.now()}));
  },
  delcm:function(t){guard(store.del('comments',t.dataset.id))},
  delpost:function(t){
    var id=t.dataset.id;
    if(S.confirmDel!==id){S.confirmDel=id;sched();setTimeout(function(){if(S.confirmDel===id){S.confirmDel=null;sched()}},4000);return}
    S.confirmDel=null;
    var rel=[];S.likes.filter(function(l){return l.pid===id}).forEach(function(l){rel.push(store.del('likes',l.id))});
    S.comments.filter(function(c){return c.pid===id}).forEach(function(c){rel.push(store.del('comments',c.id))});
    S.shares.filter(function(s){return s.pid===id}).forEach(function(s){rel.push(store.del('shares',s.id))});
    guard(store.del('posts',id).then(function(){return Promise.all(rel)})).then(function(){toast('Publicación eliminada.')});
  },
  share:function(t){shareModal(t.dataset.id)},
  copy:function(t){
    var txt=t.dataset.t;
    function done(){toast('Copiado.');if(t.dataset.share&&S.loggedIn&&S.canWrite){var id=t.dataset.share+'_'+S.uid;if(!S.shares.some(function(s){return s.id===id}))guard(store.put('shares',id,{pid:t.dataset.share,uid:S.uid,ts:Date.now()}))}}
    function fallback(){var n=$('#share-txt')||$('#handle-txt');if(n){var r=document.createRange();r.selectNodeContents(n);var s=getSelection();s.removeAllRanges();s.addRange(r)}toast('Selecciona y copia el texto.')}
    try{navigator.clipboard.writeText(txt).then(done,fallback)}catch(e){fallback()}
  },
  contact:function(t){
    var p=S.posts.filter(function(x){return x.id===t.dataset.id})[0];if(p)contactModal(p.author);
  },
  contactuser:function(t){contactModal(t.dataset.uid)},
  buy:function(t){
    if(!requireLogin()||!canDo())return;
    var pid=t.dataset.id,post=S.posts.filter(function(x){return x.id===pid})[0];if(!post||post.author===S.uid||firstPurchaseOf(pid))return;
    guard(store.put('purchases',pid+'_'+S.uid,{pid:pid,seller:post.author,buyer:S.uid,title:post.title,status:'pending',ts:Date.now()})).then(function(){toast('Listo. Cuando el vendedor lo confirme, sumará a tu título de comprador.')});
  },
  okSale:function(t){guard(store.patch('purchases',t.dataset.id,{status:'confirmed',confirmed:Date.now()})).then(function(){toast('Venta confirmada. ¡Sumaste 3 puntos!')})},
  noSale:function(t){guard(store.del('purchases',t.dataset.id))},
  editprofile:function(){editModal()},
  logout:function(){
    try{if(store.local)localStorage.removeItem('creanet.demo.session');else sessionStorage.setItem('creanet.out','1')}catch(e){}
    S.loggedIn=false;S.prevLvl=null;S.view={name:'home'};toast('Cerraste sesión.');sched();
  },
  dologin:function(){
    if(profile(S.uid)){startSession(S.uid);closeModal();toast('Sesión iniciada.');sched()}
    else{authModal('register');setTimeout(function(){setErr('Aún no tienes cuenta aquí. Créala para continuar.')},0)}
  },
  frame:function(t){guard(store.patch('profiles',S.uid,{frame:t.dataset.id}))},
  sticker:function(t){
    var p=me(),cur=(p.stickers||[]).slice(),e=t.dataset.e,i=cur.indexOf(e);
    if(i>-1)cur.splice(i,1);else{if(cur.length>=3){toast('Puedes elegir hasta 3 stickers.');return}cur.push(e)}
    guard(store.patch('profiles',S.uid,{stickers:cur}));
  },
  pemo:function(t){var f=t.closest('form');f.elements.emoji.value=t.dataset.e;$$('[data-act=pemo]',f).forEach(function(b){b.setAttribute('aria-pressed',b===t)})},
  pcol:function(t){var f=t.closest('form');f.elements.color.value=t.dataset.c;$$('[data-act=pcol]',f).forEach(function(b){b.setAttribute('aria-pressed',b===t)})}
};
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var fn=A[t.dataset.act];if(fn){fn(t,e)}
});
document.addEventListener('submit',function(e){
  var f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  var k=f.dataset.form;
  if(k==='register')doRegister(f);else if(k==='login')doLoginLocal(f);else if(k==='post')doPost(f);else if(k==='profile')doProfile(f);
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.calc){S.calc[t.dataset.calc]=t.value;calcUpdate()}
});
document.addEventListener('change',function(e){var d=e.target.dataset||{};if(d.ready!==undefined)calcUpdate();if(d.fcat!==undefined){S.filter.cat=e.target.value;sched()}if(d.bgfile!==undefined)setBg(e.target)});

/* ---------- arranque ---------- */
function watchAll(){
  var pending=COLS.length;
  COLS.forEach(function(c){
    var first=true;
    store.watch(c,function(list){
      S[c]=list;
      if(first){first=false;S.loaded[c]=true;if(--pending===0){S.ready.all=true;afterLoad()}}
      sched();
    });
  });
}
function afterLoad(){
  try{
    if(store.local){var s=localStorage.getItem('creanet.demo.session');if(s&&profile(s)){S.uid=s;S.loggedIn=true}}
    else if(S.uid&&profile(S.uid)&&sessionStorage.getItem('creanet.out')!=='1'){S.loggedIn=true}
  }catch(e){if(!store.local&&S.uid&&profile(S.uid))S.loggedIn=true}
  if(S.loggedIn)S.prevLvl=statsFor(S.uid).lvl;
  var h=location.hash;if(/^#post-[A-Za-z0-9]+$/.test(h))S.pendingHash=h.slice(1);
}
function start(db,user){
  (user?Promise.all([user.id(),user.can('data.write')]):Promise.resolve([null,null])).then(function(r){
    if(db&&r[0]){S.uid=r[0];S.canWrite=r[1]!==false;store=makeDbStore(db)}
    else store=makeLocalStore();
    S.mode='ready';watchAll();sched();
  });
}
render();
(function(){
  var use=window.claude&&typeof window.claude.use==='function'?function(n){return window.claude.use(n).catch(function(){return null})}:function(){return Promise.resolve(null)};
  Promise.all([use('db'),use('user')]).then(function(r){start(r[0],r[1])});
})();
})();
</script>

</body></html>
